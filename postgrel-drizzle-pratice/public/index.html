<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raw Testing UI - Notes API</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>[INTERNAL] Notes API Testing Tool</h1>
        <p>Use this interface to test your CRUD operations.</p>
    </header>

    <main>
        <section class="panel">
            <h2>Create New Note</h2>
            <form id="create-form">
                <div class="form-group">
                    <label for="title">Title:</label>
                    <input type="text" id="title" name="title" required>
                </div>
                
                <div class="form-group">
                    <label for="content">Content:</label>
                    <textarea id="content" name="content" rows="4" required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="status">Status:</label>
                    <select id="status" name="status">
                        <option value="draft">Draft</option>
                        <option value="published">Published</option>
                        <option value="archived">Archived</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="tags">Tags (comma separated):</label>
                    <input type="text" id="tags" name="tags" placeholder="e.g. personal, work, urgent">
                </div>
                
                <button type="submit">Submit Request</button>
            </form>
            <div id="create-response" class="response-box"></div>
        </section>

        <section class="panel">
            <h2>Fetch All Notes</h2>
            <button id="fetch-notes-btn">GET /api/notes</button>
            <div id="fetch-response" class="response-box"></div>
        </section>
        
        <section class="panel">
            <h2>Note Management (Edit / Delete)</h2>
            <div class="form-group">
                <label for="note-id">Note ID:</label>
                <input type="text" id="note-id" placeholder="Enter ID to fetch/update/delete">
            </div>
            
            <button id="fetch-single-btn">GET Note</button>
            <button id="delete-btn" class="danger">DELETE Note</button>
            
            <form id="update-form" style="margin-top: 15px;">
                <h4>Update Field Data</h4>
                <div class="form-group">
                    <label for="update-title">New Title:</label>
                    <input type="text" id="update-title">
                </div>
                <div class="form-group">
                    <label for="update-content">New Content:</label>
                    <input type="text" id="update-content">
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="update-archived"> Mark as Archived
                    </label>
                </div>
                <button type="submit">PUT Update Note</button>
            </form>
            <div id="manage-response" class="response-box"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
